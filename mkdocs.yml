# The documentation site (Read the Docs, or any MkDocs host), built from the same docs/ folder GitHub shows.
# Local preview:  pip install -r docs/requirements.txt && mkdocs serve
site_name: Looking Glass
site_description: Your Shadowserver reports, replayed as a living picture of your country. Free and open source, built in Africa, for African CSIRTs.
site_author: Ike Owuraku Amponsah
site_url: !ENV [READTHEDOCS_CANONICAL_URL, ""]
repo_url: https://github.com/anonghosty/looking-glass
repo_name: anonghosty/looking-glass
edit_uri: blob/main/docs/
copyright: Copyright &copy; 2026 Ike Owuraku Amponsah &middot; AGPL-3.0 &middot; screenshots use dummy data only

docs_dir: docs
exclude_docs: |
  media/README.md
  requirements.txt

hooks:
  - mkdocs_hooks.py

theme:
  name: material
  logo: assets/logo-mark.svg
  favicon: assets/logo-mark.svg
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Inter
    code: Geist Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/stylesheets/looking-glass.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify   # the same anchors as GitHub, so links work on both
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started:
      - Installation: INSTALLATION.md
      - Connecting the mailbox: MAIL_SETUP.md
      - Configuration: CONFIGURATION.md
  - Using Looking Glass:
      - User guide: USER_GUIDE.md
      - "Use cases: a needle through the haystack": USE_CASES.md
      - Features: FEATURES.md
      - Glossary: GLOSSARY.md
  - Running it:
      - Operations: OPERATIONS.md
      - Technical reference: TECHNICAL_REFERENCE.md
  - Security:
      - Security: SECURITY.md
      - Penetration test report: SECURITY_REPORT.md
  - Comparison with IntelMQ and Elastic: COMPARISON.md

extra_javascript:
  - assets/javascripts/films.js
  - assets/javascripts/motion.js

extra:
  generator: false
  # the films, on YouTube; a line in a guide that ends with <!-- film: NAME --> becomes this player (mkdocs_hooks.py)
