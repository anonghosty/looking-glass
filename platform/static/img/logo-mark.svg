<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Looking Glass">
  <style>
    .arc { stroke-dasharray: 4 3; animation: flow 1.4s linear infinite; }
    .ring { transform-origin: 19.4px 11.6px; animation: ping 2.4s ease-out infinite; }
    .src { animation: blink 2.4s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
    @keyframes ping { 0% { transform: scale(.6); opacity: .9; } 70%, 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .arc, .ring, .src { animation: none; } }
  </style>
  <defs>
    <linearGradient id="lg-arc" x1="8" y1="18" x2="20" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#e5484d"/>
    </linearGradient>
    <clipPath id="lg-lens"><circle cx="14" cy="14" r="8.9"/></clipPath>
  </defs>
  <circle cx="14" cy="14" r="8.9" fill="#141417"/>
  <g clip-path="url(#lg-lens)" fill="none" stroke="#ededef" stroke-opacity=".18" stroke-width="1">
    <ellipse cx="14" cy="14" rx="9" ry="3.4"/>
    <ellipse cx="14" cy="14" rx="3.6" ry="9"/>
  </g>
  <g clip-path="url(#lg-lens)">
    <path class="arc" d="M8.4 18.2 Q12.4 6.6 19.4 11.6" fill="none" stroke="url(#lg-arc)" stroke-width="1.9" stroke-linecap="round"/>
    <circle class="ring" cx="19.4" cy="11.6" r="2.7" fill="none" stroke="#e5484d" stroke-width="1"/>
  </g>
  <circle class="src" cx="8.4" cy="18.2" r="1.6" fill="#5b8def"/>
  <circle cx="19.4" cy="11.6" r="1.6" fill="#e5484d"/>
  <circle cx="14" cy="14" r="10" fill="none" stroke="#ededef" stroke-width="2.2"/>
  <path d="M21.4 21.4 L27.6 27.6" stroke="#ededef" stroke-width="3.2" stroke-linecap="round"/>
</svg>
