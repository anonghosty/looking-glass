<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="csrf-token" content="{{ lg_csrf }}">
  <title>Looking Glass · Advisory portal</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo-mark.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/settings.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/findings.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/advisory.css') }}" rel="stylesheet">
</head>
<body class="settings-page fd-page av-page">
  <header class="hud">
    <div class="hud-left">
      <img class="brand-mark" src="{{ url_for('static', filename='img/logo-mark.svg') }}" alt="" width="32" height="32">
      <div class="brand"><div class="brand-title">Looking Glass</div><div class="brand-sub"><span>Advisory portal · signed in as {{ lg_user }} ({{ lg_role }})</span></div></div>
    </div>
    <div class="hud-right">
      {% set nav_here = "advisory" %}{% set nav_go = false %}{% include "_page_nav.html" %}
    </div>
  </header>
  <main class="st-main av-main" id="apMain">
    <p class="fd-empty" id="apLoading">Loading your advisories…</p>
  </main>
  <script src="{{ url_for('static', filename='js/loader.js') }}"></script>
  <script src="{{ url_for('static', filename='js/advisory-portal.js') }}"></script>
</body>
</html>
