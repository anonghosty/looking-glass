# Read the Docs: builds the documentation site from mkdocs.yml and docs/ on every push
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

# the docs site's libraries from their lock: exact versions with their sha256 values, so pip checks every file
# (tools/lock_requirements.sh makes docs/requirements.lock from docs/requirements.txt)
python:
  install:
    - requirements: docs/requirements.lock
