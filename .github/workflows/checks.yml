# The checks that need no live data and no secrets, on every push and pull request (external review, 2026-11-12: there
# was no CI). The full suite (platform/tests/run_all_checks.sh) and the security retest need a running installation with
# its data, so they run on the server, not here.
# Hardened 2026-11-15 (review follow-up item 7): every action is pinned to a full commit (a moved tag cannot run new code
# here), MongoDB runs in a container pinned to its image digest for the checks that need a database, and the libraries
# are checked against known vulnerabilities (pip-audit). Static analysis (Bandit, ShellCheck) runs in its own job. Update a pin on purpose, with its version in the comment, and
# confirm it is the action's own tag (a fork's commit can be reached by the same URL):
#   git ls-remote --tags https://github.com/actions/checkout | grep <commit>
name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  database:
    # the checks that make a throwaway database of their own: MongoDB 8.0 (pinned by digest) with an administrator whose
    # password is made new in each run (never stored anywhere), handed over as tests/_throwaway_mongo.py expects
    runs-on: ubuntu-24.04
    env:
      MONGO_HOST: 127.0.0.1
      MONGO_PORT: "27017"
      MONGO_DB: shadowserver     # empty here: the checks use made-up rows when it has none
      LG_QUIET: "1"
      THREATMAP_SCHEDULE: "0"
      # the outside-connection guard (platform/tests/no_outside), set on the check steps only (never on pip): only this
      # runner and the database may be reached, every other attempt is refused and written down; a made-up map key
      # switches the map look-ups on, so a check that should send nothing is seen if it tries (2026-11-18: an
      # advisory sent place names to the geocoder)
      GUARD_LOG: ${{ github.workspace }}/outside-database.jsonl
      GUARD_PATH: ${{ github.workspace }}/platform/tests/no_outside
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1      # v7.0.1, Node 24 (tag in actions/checkout)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, Node 24 (tag in actions/setup-python)
        with:
          python-version: "3.12"
      # the libraries from the locks only: exact versions, every file checked against its sha256 value; a file that does
      # not match, or a library the lock does not list, stops the job (tools/lock_requirements.sh makes the locks)
      - name: Install the platform's libraries
        run: 'python -m pip install --require-hashes --only-binary=:all: -r platform/requirements.lock'
      - name: Start MongoDB 8.0 with a one-run administrator
        run: |
          set -e
          PW="$(openssl rand -hex 24)"; echo "::add-mask::$PW"
          docker run -d --name mongo -p 127.0.0.1:27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=ci -e MONGO_INITDB_ROOT_PASSWORD="$PW" \
            mongo@sha256:d97fea17ccb8d004cd137be8dab54d70d0df11be69c9f422aefe4484c8414ab7
          umask 077
          printf 'MONGO_USER=ci\nMONGO_PASSWORD=%s\nMONGO_AUTH_SOURCE=admin\n' "$PW" > "$RUNNER_TEMP/mongo-admin.env"
          echo "LG_MONGO_ADMIN_FILE=$RUNNER_TEMP/mongo-admin.env" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ping: 1}).ok' >/dev/null 2>&1 && exit 0; sleep 2; done
          echo "MongoDB did not start"; docker logs mongo | tail -20; exit 1
      - name: Checks that need a database
        working-directory: platform
        env:
          LG_NO_OUTSIDE: ${{ env.GUARD_LOG }}
          PYTHONPATH: ${{ env.GUARD_PATH }}
          MAPBOX_TOKEN: dummy-map-key-for-checks
        run: |
          set -e
          for t in test_new_collections test_new_service_collections check_quarterly; do
            echo "::group::$t"
            # here the database is there: a skip (exit 77) is a failure
            if ! python tests/$t.py; then echo "$t did not pass"; exit 1; fi
            echo "::endgroup::"
          done
      - name: Checks that need report data (a made-up week, documentation addresses only)
        working-directory: platform
        env:
          LG_CI_SEED: "1"
          LG_NO_OUTSIDE: ${{ env.GUARD_LOG }}
          PYTHONPATH: ${{ env.GUARD_PATH }}
          MAPBOX_TOKEN: dummy-map-key-for-checks
        run: |
          set -e
          # the platform reads the throwaway database with the one-run administrator (never stored anywhere)
          set -a; . "$LG_MONGO_ADMIN_FILE"; set +a
          python tests/ci_seed.py
          # check_combo_review and check_ticked_names decide which devices an advisory carries (security review, 2026-11-17)
          # check_advisory_attack and check_confirm_all here too: with report data and the map key, an advisory that
          # loads a day would look places up, and their "nothing left the server" catches it
          for t in check_combos check_acodes check_management check_combo_review check_ticked_names check_advisory_attack check_confirm_all; do
            echo "::group::$t"
            if ! python tests/$t.py; then echo "$t did not pass"; exit 1; fi
            echo "::endgroup::"
          done
      - name: Nothing reached outside (the guard's list)
        if: always()
        working-directory: platform
        run: python tests/no_outside/report.py "$GUARD_LOG"
  signoff:
    # every commit of a pull request is signed off by its own author: the Developer Certificate of Origin 1.1
    # (CONTRIBUTING.md, "Commits"; OpenSSF Best Practices "dco", 2026-11-20). Plain git, no outside action.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1      # v7.0.1, Node 24 (tag in actions/checkout)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Commits signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            a="$(git show -s --format='%an <%ae>' "$c")"
            if git show -s --format=%B "$c" | grep -qxF "Signed-off-by: $a"; then echo "ok   $c"; else
              echo "::error::commit $c is not signed off by its author ($a): git commit --amend -s, or git rebase --signoff"; bad=1; fi
          done
          exit $bad
  dependencies:
    # known vulnerabilities in the platform's and the pipeline's libraries (PyPI advisory data, OSV)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1      # v7.0.1, Node 24 (tag in actions/checkout)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, Node 24 (tag in actions/setup-python)
        with:
          python-version: "3.12"
      # the exact versions that are installed (the locks), the docs site's included; read as they are, nothing installed
      - name: pip-audit
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --require-hashes --disable-pip -r platform/requirements.lock -r database/requirements.lock -r docs/requirements.lock --progress-spinner off
  static-analysis:
    # Static code analysis on every push and pull request, so on every release (OpenSSF Best Practices, 2026-11-15):
    # Bandit for the Python code (fails on medium or high severity; the low ones are listed) and ShellCheck for the
    # shell scripts (fails on warnings). A finding kept on purpose is marked where it is, with the reason:
    # "# nosec B310  # why" (Bandit) or "# shellcheck disable=SC2024  # why" (ShellCheck).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1      # v7.0.1, Node 24 (tag in actions/checkout)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, Node 24 (tag in actions/setup-python)
        with:
          python-version: "3.12"
      - name: Install Bandit and ShellCheck
        run: |
          python -m pip install bandit==1.9.4 shellcheck-py==0.11.0.1 ruff==0.17.6
      # the coding rules (ruff.toml at the top of the repository): a change that breaks one fails here
      - name: Ruff (coding rules)
        run: ruff check --output-format github platform database
      - name: Bandit (Python)
        run: |
          bandit -r platform database -x '*/tests/*' -ll
          echo "::group::Low-severity notes (listed, not failing)"
          bandit -r platform database -x '*/tests/*' -q --exit-zero -f custom --msg-template '{test_id} {relpath}:{line} {msg}'
          echo "::endgroup::"
      - name: ShellCheck (shell scripts)
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -S warning
  unit:
    runs-on: ubuntu-24.04
    env:
      MONGO_HOST: 127.0.0.1      # nothing listens there: a test that needs the database would fail, not pass by accident
      MONGO_PORT: "1"
      LG_QUIET: "1"
      THREATMAP_SCHEDULE: "0"
      # the outside-connection guard and a made-up map key on the check steps, as in the database job
      GUARD_LOG: ${{ github.workspace }}/outside-unit.jsonl
      GUARD_PATH: ${{ github.workspace }}/platform/tests/no_outside
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1      # v7.0.1, Node 24 (tag in actions/checkout)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, Node 24 (tag in actions/setup-python)
        with:
          python-version: "3.12"
      - name: Install the platform's and the pipeline's libraries
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r platform/requirements.lock -r database/requirements.lock
          # the PDF page check renders every page (tests/pdf_pages_check.py); only the checks need it, not the platform
          python -m pip install pypdfium2==5.15.2
      # every check that needs no database and no running service (review 2026-11-13: about 20 of them were left out,
      # the CSRF, sign-in, MFA, settings, masking and Workers checks among them). The others skip by themselves without
      # MongoDB or the service (exit 77): they run on the server, in platform/tests/run_all_checks.sh.
      - name: Platform checks
        working-directory: platform
        env:
          LG_NO_OUTSIDE: ${{ env.GUARD_LOG }}
          PYTHONPATH: ${{ env.GUARD_PATH }}
          MAPBOX_TOKEN: dummy-map-key-for-checks
        run: |
          set -e
          for t in test_privacy_roles test_schedule check_ip_find check_host_label_text check_masked_fields check_banner_inbound check_data_access \
                   check_auth_offline check_login_throttle check_single_worker check_audit_write_failure check_csp_sources check_proxy_chain check_https_only check_password_policy check_csrf_routes check_settings_access \
                   check_first_admin_proxy check_retest_reset check_workflow_fixes check_calc_offline \
                   check_audit_portal check_device_note check_cve_titles check_ci_pins check_audit_checkpoint check_backup_scripts check_auditor_portal check_pipeline_settings check_scope_reload check_libraries \
                   check_cve_backoff check_uninstall check_timezones check_world_maps check_region_matches check_day_keep check_warmup check_hsts check_request_limits check_at_rest check_file_modes check_special_reports check_report_map \
                   check_findings_ui check_notifications check_overview check_greetings check_peace check_networks_list check_wrong_types check_kb_report_names check_slow_log check_lockouts check_system_alerts check_response_cache check_task_monitor check_acode_chain check_intelligence check_code_collisions check_finding_watch check_acode_issue check_db_connect check_install_db check_install_cert check_installer_anim check_offline_names check_attack_map check_advisory_attack check_confirm_all check_cve_attack \
                   check_beacon_decode check_beacon_findings check_beacon_unknown check_spike_notice check_glossary_sync check_ai_framework check_masked_ids \
                   check_index_refresh check_beacon_keep check_day_skip check_config_page check_findings_live check_pdf_rows check_pdf_refs pdf_pages_check check_per_key_cache check_recent_days \
                   check_select_enhancer check_invite_limit check_quarterly_access check_feature_coverage check_installer_supply; do
            echo "::group::$t"; python tests/$t.py; echo "::endgroup::"
          done
          # the module part only: the filter and who sees it need the platform (run_all_checks.sh on the server)
          echo "::group::check_beacon_stats"; LG_UNIT_ONLY=1 python tests/check_beacon_stats.py; echo "::endgroup::"
      - name: Pipeline checks
        working-directory: database
        env:
          LG_NO_OUTSIDE: ${{ env.GUARD_LOG }}
          PYTHONPATH: ${{ env.GUARD_PATH }}
        run: |
          set -e
          for t in test_mail_auth test_dns_https test_mail_auth_pipeline test_sender_readiness test_worker_settings_effective test_link_downloads test_zip_limits test_line_hash test_report_api \
                   test_report_types test_report_names test_equivalence test_refetch_and_rows test_retention test_no_ip_reports test_load_stamps \
                   test_quarterly_purge; do
            echo "::group::$t"; python tests/$t.py; echo "::endgroup::"
          done
          python -m unittest tests.test_mail_sources
      - name: Nothing reached outside (the guard's list)
        if: always()
        working-directory: platform
        run: python tests/no_outside/report.py "$GUARD_LOG"
